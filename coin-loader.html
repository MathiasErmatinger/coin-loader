<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Coin loader</title>
<style>
body { display:grid; place-items:center; min-height:100vh; margin:0; overflow:hidden; background:#fff; }
.coin-loader { --size: 160px; width:var(--size); height:var(--size); perspective: calc(var(--size) * 6); }
.turn { position:relative; width:100%; height:100%; transform-style:preserve-3d; animation: turn 20.16s cubic-bezier(.45,0,.55,1) infinite; }
.flip { width:100%; height:100%; transform-style:preserve-3d; animation: flip 2.52s ease-in-out infinite; }
.turn svg { position:absolute; inset:0; width:100%; height:100%; }
.face { backface-visibility:hidden; }
.front { transform: translateZ(4px); }
.back  { transform: rotateY(180deg) translateZ(4px); }
@keyframes flip {
  0%,9.52% { transform: rotateY(0); }  38.1%,47.62% { transform: rotateY(180deg); }  76.19%,100% { transform: rotateY(0); }
}
@keyframes turn {
  0.000% { transform: rotateZ(0deg); }
  9.524% { transform: rotateZ(0deg); }
  12.500% { transform: rotateZ(45deg); }
  22.024% { transform: rotateZ(45deg); }
  25.000% { transform: rotateZ(90deg); }
  34.524% { transform: rotateZ(90deg); }
  37.500% { transform: rotateZ(135deg); }
  47.024% { transform: rotateZ(135deg); }
  50.000% { transform: rotateZ(180deg); }
  59.524% { transform: rotateZ(180deg); }
  62.500% { transform: rotateZ(225deg); }
  72.024% { transform: rotateZ(225deg); }
  75.000% { transform: rotateZ(270deg); }
  84.524% { transform: rotateZ(270deg); }
  87.500% { transform: rotateZ(315deg); }
  97.024% { transform: rotateZ(315deg); }
  100% { transform: rotateZ(360deg); }
}
@media (prefers-reduced-motion: reduce) { .turn, .flip { animation-duration: 0s; } }
</style>
